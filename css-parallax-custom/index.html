<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>css-parallax-custom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <!-- ページトップ -->
         <section id="page-top">
            <h1>My Hobbies</h1>
            <p class="my-name">河野 花蓮</p>
         </section>
         <!-- ページ01 -->
          <section id="page-01">
            <div class="inner">
                <h2>セルフネイル</h2>
                <p>ピンタレストで見つけたデザインを参考にセルフネイルをするのが好きです。</p>
            </div>
         </section>
         <!-- ページ02 -->
          <section id="page-02">
            <div class="inner">
                <h2>編み物</h2>
                <p>かぎ針編みしかやってなかったので、最近は輪針編みに挑戦してます。</p>
            </div>
         </section>
         <!-- ページ03 -->
          <section id="page-03">
            <div class="inner">
                <h2>梅</h2>
                <p>自分が20歳になるタイミングで開けられるように6月に漬けた梅酒をワクワクしながら眺めてます。</p>
            </div>
         </section><!-- ページ04 -->
          <section id="page-04">
            <div class="inner">
                <h2>食器収集</h2>
                <p>可愛い食器を収集するのが好きで、すでに40個ほど食器を持ってます。</p>
            </div>
         </section>
    </main>
</body>
</html>
